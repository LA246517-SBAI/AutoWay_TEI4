<div class="page-layout">
  <div class="page-header">
    <app-navbar></app-navbar>
  </div>

  <div class="page-content">
    <div class="page-container">
      <h1>Livres</h1>

      <div class="card">
        <div class="card-header">
          <h3>Liste des Livres</h3>
          <button class="btn btn-primary btn-sm" routerLink="/livres/new" *ngIf="isAdmin">
            <mat-icon>add</mat-icon> Ajouter
          </button>
        </div>

        <div class="filter-section">
          <div class="filter-group">
            <label class="form-label">Rechercher par titre :</label>
            <input
              type="text"
              class="form-input"
              [(ngModel)]="searchTitre"
              (input)="applyFilters()"
              placeholder="Titre du livre...">
          </div>

          <div class="filter-group">
            <label class="form-label">Rechercher par auteur :</label>
            <input
              type="text"
              class="form-input"
              [(ngModel)]="searchAuteur"
              (input)="applyFilters()"
              placeholder="Nom de l'auteur...">
          </div>

          <div class="filter-group">
            <label class="form-label">Filtrer par catégorie :</label>
            <select class="form-select" [(ngModel)]="selectedCategorieId" (change)="filterByCategorie()">
              <option [ngValue]="null">Toutes</option>
              <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.nom }}</option>
            </select>
          </div>

          <button class="btn btn-clear" (click)="clearFilters()" title="Réinitialiser les filtres">
            <mat-icon>clear</mat-icon>
          </button>
        </div>

        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Titre</th>
                <th>Auteur</th>
                <th>Année</th>
                <th class="text-center">Exemplaires</th>
                <th>Catégorie</th>
                <th *ngIf="!isAdmin" class="text-center">Emprunter</th>
                <th *ngIf="isAdmin">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let l of livres">
                <td>{{ l.titre }}</td>
                <td>{{ l.auteur }}</td>
                <td>{{ l.annee }}</td>
                <td class="text-center">
                  <span *ngIf="l.nbExemplaires === 0" class="badge-indisponible">Indisponible</span>
                  <span *ngIf="l.nbExemplaires > 0">{{ l.nbExemplaires }}</span>
                </td>
                <td>{{ getCategorieNom(l.categorieId) }}</td>
                <td *ngIf="!isAdmin" class="text-center emprunt-cell">
                  <span *ngIf="isLivreDejaEmprunte(l.id)" class="badge-deja-emprunte">Déjà emprunté</span>
                  <button *ngIf="!isLivreDejaEmprunte(l.id) && l.nbExemplaires > 0"
                          class="btn btn-emprunter"
                          (click)="emprunterLivre(l)"
                          title="Emprunter ce livre">
                    <mat-icon>book</mat-icon> Emprunter
                  </button>
                  <span *ngIf="!isLivreDejaEmprunte(l.id) && l.nbExemplaires === 0" class="text-muted">-</span>
                </td>
                <td *ngIf="isAdmin" class="actions-cell">
                  <button class="btn btn-sm" [routerLink]="['/livres/edit', l.id]" title="Modifier">
                    <mat-icon>edit</mat-icon>
                  </button>
                  <button class="btn btn-sm" (click)="deleteLivre(l)" title="Supprimer">
                    <mat-icon>delete</mat-icon>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>
