<app-header></app-header>

<div class="emprunts-container">
  <div class="header-section">
    <h1>Mes emprunts</h1>
    <hr class="separator">
  </div>

  <div *ngIf="isLoading" class="loading">
    <p>Chargement de vos emprunts...</p>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    <p>{{ errorMessage }}</p>
  </div>

  <div *ngIf="!isLoading && emprunts.length === 0 && !errorMessage" class="empty-message">
    <p>Aucun emprunt en cours</p>
  </div>

  <div class="table-wrapper" *ngIf="!isLoading && emprunts.length > 0">
    <table class="emprunts-table">
      <thead>
        <tr>
          <th>Titre</th>
          <th>Date d'emprunt</th>
          <th>Date de retour</th>
          <th>Retourner le livre</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let emprunt of emprunts" [class.en-retard]="isEnRetard(emprunt.dateRetourPrevue)">
          <td class="titre">{{ emprunt.livre.titre }}</td>
          <td class="date">{{ emprunt.dateEmprunt | date: 'dd/MM/yyyy' }}</td>
          <td class="date" [class.retard-text]="isEnRetard(emprunt.dateRetourPrevue)">
            {{ emprunt.dateRetourPrevue | date: 'dd/MM/yyyy' }}
            <div *ngIf="isEnRetard(emprunt.dateRetourPrevue)" class="retard-label">En retard</div>
          </td>
          <td class="action">
            <button class="return-btn" (click)="retournerLivre(emprunt.livreId, emprunt.id)">
              Retourner maintenant
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
